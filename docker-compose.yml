services:
  postgres:
    image: postgres:16
    container_name: plumberlama-postgres
    environment:
      POSTGRES_USER: plumberlama
      POSTGRES_PASSWORD: plumberlama_dev
      POSTGRES_DB: survey_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plumberlama -d survey_data"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - plumberlama

  pipeline:
    build: .
    # or use a released image: ghcr.io/correlaid/plumberlama:0.1.0
    container_name: plumberlama-pipeline
    env_file:
      - .env
    environment:
      # Connect to the postgres service above (overrides .env)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: survey_data
      DB_USER: plumberlama
      DB_PASSWORD: plumberlama_dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - plumberlama

volumes:
  postgres_data:

networks:
  plumberlama:
    driver: bridge
