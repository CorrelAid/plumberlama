name: release

# release-please keeps a "Release PR" open that bumps the version and updates
# CHANGELOG.md based on Conventional Commits. Merging that PR creates the tag
# and GitHub release, then this workflow builds and publishes to PyPI and
# pushes the versioned Docker image.
#
# Releases created with GITHUB_TOKEN don't trigger other workflows, so
# publishing happens in this workflow instead of on a `release` event.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: astral-sh/setup-uv@v6

      - name: Check tag is semver and matches package version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(a|b|rc)[0-9]+)?$ ]] \
            || { echo "Tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          VERSION="$(uv version --short)"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Run unit tests
        run: uv run --frozen pytest tests/unit

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/plumberlama
    permissions:
      id-token: write  # trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: [release-please, build]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build.yaml
    with:
      version: ${{ needs.release-please.outputs.version }}
      ref: ${{ needs.release-please.outputs.tag_name }}
