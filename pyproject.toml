[project]
name = "plumberlama"
version = "0.1.1"
description = "Pipeline to process, anonymize and load LamaPoll survey results to a database"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CorrelAid e.V." }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "dspy>=3.0.3",
    "polars>=1.33.1",
    "requests>=2.32.5",
    "rich>=14.1.0",
    "connectorx>=0.4.0",
    "click>=8.1.0",
    "pyarrow>=21.0.0",
    "pandera>=0.26.1",
    "email-validator>=2.3.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/CorrelAid/plumberlama"
Repository = "https://github.com/CorrelAid/plumberlama"
Documentation = "https://github.com/CorrelAid/plumberlama-docs"
Issues = "https://github.com/CorrelAid/plumberlama/issues"

[project.scripts]
plumberlama = "plumberlama.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/plumberlama", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
/(
    src/plumberlama/generated_api_models\.py
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long - handled by black
exclude = ["src/plumberlama/generated_api_models.py"]


[tool.ruff.format]
# Use black-compatible settings
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "python-dotenv>=1.1.1",
    "ruff>=0.14.0",
    "black>=25.9.0",
    "pre-commit>=4.3.0",
    "datamodel-code-generator>=0.35.0",
]
analysis = [
    "jupyter>=1.1.1",
    "jupyter-contrib-nbextensions>=0.7.0",
    "pandas>=2.0.0",
    "seaborn>=0.13.2",
    "scipy>=1.16.3",
    "altair>=5.5.0",
]
